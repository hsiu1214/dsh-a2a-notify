# dsh-a2a-notify bundle patch: inserts the plugin row into the profile.
# Applied as a bundle layer through the `dsh.bundle.patch` manifest field, so
# installing the package is all it takes.
#
# Optional configuration, in your profile's cordis.patch.yml:
#
#   - id: a2a-notify
#     config:
#       notifyOn:            # omit a key to disable that event type
#         added: true        # new session created anywhere
#         running: true      # session started running a turn
#         finished: true     # session turn finished (running -> false)
#         error: true        # agent error
- insert:
    - id: a2a-notify
      name: dsh-a2a-notify
